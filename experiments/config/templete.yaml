dataset_dir: /data8/zhangdeming/.cache/huggingface/datasets/zai-org/LongBench/data
desc:  "tempelete"

exp_config:
  name: tempelete
  batch_size: 32
  max_total_token: 32768
reranker_config:
  model_type: rerank # rerank,null
  model_name: Qwen/Qwen3-Reranker-0.6B
  max_position_embeddings: 32768
  chunk_size: [256]
  # rate 同时支持比例与绝对数量：< 1 时为保留比例（如 0.3 表示保留 30% chunk），>= 1 时为保留的 chunk 数（如 4 表示保留 4 个 chunk）。
  # 仅对 RerankCompressor 生效。
  # selection_mode 为 threshold 时，rate 复用为 score(P(yes)) 阈值，保留所有 score >= rate 的 chunk（至少保留得分最高的一块）。
  rate: [0.3,0.4,0.5,0.6]
  device_id: 0
  engine: vllm
  selection_mode: topk # topk, pure-topk, cluster, topp, cluster-zscore, threshold, shunt
  # shunt 模式下：chunk_size 为重要性池大小(如 256)，覆盖性池按 coverage_chunk_size 切分（默认 chunk_size//2）
  # coverage_ratio: 0.3  # topk/shunt 覆盖性采样占比（默认 1/3），如 0.3 表示 30% 预算给覆盖性、70% 给重要性
  # coverage_chunk_size: 128  # 仅 shunt 模式：覆盖性池切分大小，默认 chunk_size//2

compressor_config:
  model_type: null # # longllmlingua,llmlingua2,llm, rerank, PPL, null
  model_name: Qwen/Qwen3-0.6B
  max_position_embeddings: 32768
  chunk_size: 128
  rate: 0.5
  # threshold: [2000]
  device_id: 0

llm_config:
  device_ids: 1
  llm:
    model_name: Qwen/Qwen2.5-7B-Instruct
    tp: 1
  sampling:
    temperature: 0.0